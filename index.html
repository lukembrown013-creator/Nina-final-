<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FAF6EF">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nina Fit">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preload" href="fonts/quicksand.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/caveat.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<title>Nina Fit</title>
</head>
<body data-area="home">
<main id="view" aria-live="polite"></main>

<button id="mini" hidden data-action="wk-resume" aria-label="Resume workout">
  <span class="mini-dot"></span>
  <span id="mini-name"></span>
  <span id="mini-time"></span>
  <span class="mini-go">Resume</span>
</button>

<button id="fab" data-action="quick" aria-label="Quick add">
  <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<nav id="tabbar" aria-label="Main">
  <button class="tab" data-action="tab" data-tab="home"><i><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.5L12 4l8.5 7.5"/><path d="M5.5 10.5V20h13v-9.500"/></svg></i><span>Today</span></button>
  <button class="tab" data-action="tab" data-tab="plan"><i><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="4"/><line x1="3.5" y1="10" x2="20.5" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/><polyline points="9 15 11 17 15 13"/></svg></i><span>Plan</span></button>
  <button class="tab" data-action="tab" data-tab="food"><i><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v7a2 2 0 0 0 4 0V3"/><line x1="9" y1="12" x2="9" y2="21"/><path d="M17 21V3c-2 1.5-3 4-3 7 0 1.5 1 2.5 3 2.5"/></svg></i><span>Food</span></button>
  <button class="tab" data-action="tab" data-tab="train"><i><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="12" x2="17" y2="12"/><line x1="7" y1="7" x2="7" y2="17"/><line x1="17" y1="7" x2="17" y2="17"/><line x1="3.5" y1="9.5" x2="3.5" y2="14.5"/><line x1="20.5" y1="9.5" x2="20.5" y2="14.5"/></svg></i><span>Train</span></button>
  <button class="tab" data-action="tab" data-tab="progress"><i><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 6"/><polyline points="15 6 21 6 21 12"/></svg></i><span>Progress</span></button>
</nav>

<div id="workout" hidden></div>
<div id="coach" hidden></div>
<div id="scan" hidden></div>
<div id="sheet-root"></div>
<div id="intro" hidden></div>
<div id="toast" role="status"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<input id="photo-file" type="file" accept="image/*" capture="environment" hidden>
<input id="meal-file" type="file" accept="image/*" capture="environment" hidden>
<input id="meal-library" type="file" accept="image/*" hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
